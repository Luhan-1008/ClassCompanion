spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/android?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

server:
  port: 8080
  address: 0.0.0.0  # 允许外部访问

jwt:
  secret: ${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF}
  expirationMinutes: 120
